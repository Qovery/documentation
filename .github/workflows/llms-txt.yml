name: llms files and sitemap are up to date

on:
  pull_request:
    paths:
      - "docs/docs.json"
      - "docs/**/*.mdx"
      - "docs/llms.txt"
      - "docs/llms-full.txt"
      - "docs/sitemap.xml"
      - "scripts/llms/**"
      - "scripts/sitemap/**"
      - "docs/api-reference/openapi.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          # the sitemap reads each page's git history
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: python3 scripts/llms/generate.py --check
      - run: python3 scripts/sitemap/generate.py --check
